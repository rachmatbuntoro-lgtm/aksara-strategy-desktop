name: Build Aksara Strategy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: npm install --legacy-peer-deps

      - name: Install UI deps
        working-directory: ui
        run: rm -f package-lock.json && npm install --legacy-peer-deps

      - name: Build UI
        working-directory: ui
        run: npx vite build

      - name: Build Electron Mac
        run: npx electron-builder --mac --arm64 --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Aksara-Strategy-Mac
          path: release/*.dmg

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aksara-Strategy-Mac-ZIP
          path: release/*.zip

      - name: Auto-upload Mac DMG to tmpfiles
        shell: bash
        run: |
          for dmg in release/*.dmg; do
            echo "Uploading $dmg..."
            RESP=$(curl -s -F "file=@$dmg" https://tmpfiles.org/api/v1/upload)
            echo "MAC_DMG_URL: $RESP"
          done

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: npm install

      - name: Install UI deps
        working-directory: ui
        run: Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue; npm install

      - name: Build UI
        working-directory: ui
        run: npx vite build

      - name: Build Electron Windows
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Aksara-Strategy-Windows
          path: release/*.exe

      - name: Auto-upload Windows EXE to tmpfiles
        shell: bash
        run: |
          for exe in release/*.exe; do
            echo "Uploading $exe..."
            RESP=$(curl -s -F "file=@$exe" https://tmpfiles.org/api/v1/upload)
            echo "WIN_EXE_URL: $RESP"
          done
